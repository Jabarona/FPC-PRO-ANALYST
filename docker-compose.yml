version: '3.8'

services:
  backend:
    build: ./fpc-backend
    container_name: fpc_backend
    ports:
      - "8000:8000"
    volumes:
      - ./fpc-backend:/app
    environment:
      - DB_HOST=host.docker.internal
    env_file:
      - ./fpc-backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./fpc-frontend
    container_name: fpc_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./fpc-frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
